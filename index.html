<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검강화게임</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- 기본 퀴즈 파일과 추가 퀴즈 파일들을 모두 불러옵니다. -->
    <script src="quiz_data.js"></script>
    <script src="quiz_data1.js"></script>
    <script src="quiz_data2.js"></script>
    <script src="quiz_data3.js"></script>
    <script src="quiz_data(우주).js"></script>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --line-color: #e0e6ed;
            --text-color: #2c3e50;
            --border-color: #34495e;
            --panel-bg: rgba(255, 255, 255, 0.8);
            
            --success: #27ae60;
            --info: #2980b9;
            --warning: #f39c12;
            --danger: #c0392b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 1.3rem;
        }

        /* Colors for log */
        .c-s { color: var(--success); font-weight: bold; }
        .c-m { color: var(--text-color); }
        .c-f { color: var(--warning); }
        .c-d { color: var(--danger); font-weight: bold; }
        .c-info { color: var(--info); font-weight: bold; }

        header {
            text-align: center;
            margin: 20px 0;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        #gold-display {
            font-size: 2rem; 
            color: #f39c12; 
            margin-top: 10px; 
            font-weight: bold; 
            text-shadow: 1px 1px 0 #333;
        }

        #main-area {
            display: flex;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Left Canvas Area (Responsive Fix) */
        #canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        canvas {
            border: 4px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
            border-radius: 2px 255px 3px 25px / 255px 5px 225px 3px;
            /* 모바일 화면을 위한 반응형 설정 */
            width: 100%;
            max-width: 450px;
            height: auto;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif;
            background: var(--bg-color);
            border: 3px solid var(--border-color);
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--border-color);
            transition: all 0.1s;
        }
        button:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--border-color);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 var(--border-color);
        }

        #enhance-btn {
            font-size: 2.2rem;
            padding: 15px 40px;
            background-color: #f1c40f;
            width: 100%;
            box-sizing: border-box;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #enhance-btn:active {
            animation: none;
            transform: translate(3px, 3px);
        }

        /* Right UI Panel (Responsive Fix) */
        #ui-panel {
            width: 100%;
            max-width: 450px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 5px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 5px;
        }

        #prob-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            font-size: 1.5rem;
        }
        #prob-list li { margin-bottom: 8px; }

        /* Items */
        .item-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            padding: 12px;
            font-size: 1.4rem;
            background: #fff;
            box-shadow: none;
            border: 2px solid var(--border-color);
        }
        .item-btn.active {
            background: #e8f8f5;
            border-color: #27ae60;
        }
        .item-count {
            font-size: 1.2rem;
            color: #555;
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Shop */
        .shop-btn {
            flex: 1;
            font-size: 1.3rem;
            padding: 10px 4px;
            background: #fff;
            border: 2px solid var(--border-color);
            box-shadow: none;
        }
        .shop-btn:hover { background: #f0f0f0; }

        #log-container {
            width: 100%;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
            height: 150px;
            font-size: 1.3rem;
            line-height: 1.4;
            box-sizing: border-box;
        }

        /* Inventory UI */
        #inventory-panel {
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
            display: flex;
            gap: 15px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }
        .inv-slot {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--border-color);
            background: #fff;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inv-slot:hover { background: #f0f0f0; }
        .inv-lvl {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Dictionary Modal */
        #dict-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #dict-content {
            width: 80%;
            height: 80%;
            background: var(--bg-color);
            border: 4px solid var(--border-color);
            box-shadow: 10px 10px 0 var(--border-color);
            padding: 20px;
            overflow-y: auto;
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
        }
        .dict-card {
            border: 2px solid var(--border-color);
            background: #fff;
            padding: 10px;
            text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .dict-card.locked { opacity: 0.7; }
        .dict-name { font-size: 1.3rem; margin-top: 5px; font-weight: bold; }

        /* Ranking Modal */
        #ranking-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #ranking-content {
            width: 80%;
            max-width: 600px;
            height: 80%;
            background: var(--bg-color);
            border: 4px solid var(--border-color);
            box-shadow: 10px 10px 0 var(--border-color);
            padding: 20px;
            overflow-y: auto;
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            font-size: 1.4rem;
        }
        .ranking-rank {
            font-weight: bold;
            font-size: 1.8rem;
            color: #e74c3c;
            width: 50px;
        }
        .ranking-info {
            flex: 1;
            text-align: left;
            margin-left: 10px;
        }
        .ranking-uid {
            font-size: 1rem;
            color: #7f8c8d;
            word-break: break-all;
        }

        /* Quiz Modal */
        #quiz-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        #quiz-content {
            width: 100%;
            max-width: 500px;
            background: var(--bg-color);
            border: 4px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
            box-sizing: border-box;
        }
        .quiz-btn {
            font-size: 1.1rem;
            margin: 5px;
            padding: 10px 20px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif;
        }
        .quiz-btn:active { transform: scale(0.95); }
        #quiz-choices button {
            display: block; width: 100%; margin: 10px 0; text-align: left; padding-left: 20px; box-sizing: border-box;
        }

        /* Custom Alert Modal */
        #custom-alert-modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center; flex-direction:column; padding: 20px; box-sizing: border-box;
        }
        #custom-alert-content {
            background:var(--bg-color); border:4px solid var(--border-color); padding:30px; border-radius:10px; text-align:center; width: 100%; max-width: 400px; box-sizing: border-box; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif; background-image: repeating-linear-gradient(transparent, transparent 31px, var(--line-color) 31px, var(--line-color) 32px);
        }
        #custom-alert-message {
            font-size:1.8rem; font-weight:bold; margin-bottom:20px; color:var(--danger); white-space: pre-wrap;
        }
        #custom-alert-btn {
            font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif; font-size:1.5rem; padding:10px 30px; background:var(--border-color); color:#fff; border:none; border-radius:5px; cursor:pointer; box-shadow: 3px 3px 0 #000; width: 100%;
        }

        /* 자동 저장 알림 인디케이터 */
        #save-indicator {
            position: fixed; top: 20px; right: 20px; background: rgba(46, 204, 113, 0.9); color: white; padding: 10px 20px; border-radius: 30px; font-size: 1.3rem; font-weight: bold; opacity: 0; transition: opacity 0.5s ease-in-out; z-index: 3000; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); pointer-events: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 500px) {
            h1 { font-size: 3rem; }
            #main-area { padding: 10px; gap: 20px; }
            #ui-panel { padding: 15px; }
            .shop-btn { font-size: 1.1rem; padding: 8px 2px; }
            .item-btn { font-size: 1.2rem; flex-direction: column; align-items: flex-start; gap: 5px; }
            .inv-slot { width: 55px; height: 55px; }
            #enhance-btn { font-size: 1.8rem; padding: 10px; }
            .btn-group button { padding: 10px; font-size: 1.3rem; flex: 1; }
        }
    </style>
</head>
<body>

    <!-- Dictionary Modal -->
    <div id="dict-modal">
        <h2 style="font-size: 3rem; margin-bottom: 20px; background:#fff; padding:0 20px; border:3px solid #333; text-align:center;">검 도감</h2>
        <div id="dict-content">
            <!-- 자바스크립트로 구간별 도감이 생성됩니다 -->
        </div>
        <button onclick="document.getElementById('dict-modal').style.display='none'" style="margin-top:20px; padding: 10px 40px;">닫기</button>
    </div>

    <!-- Ranking Modal -->
    <div id="ranking-modal">
        <h2 style="font-size: 3rem; margin-bottom: 20px; background:#fff; padding:0 20px; border:3px solid #333; text-align:center;">🏆 명예의 전당 🏆</h2>
        <div id="ranking-content">
            <div id="ranking-content-list">
                <!-- 자바스크립트로 랭킹 목록이 생성됩니다 -->
            </div>
        </div>
        <button onclick="document.getElementById('ranking-modal').style.display='none'" style="margin-top:20px; padding: 10px 40px;">닫기</button>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal">
        <div id="quiz-content">
            <h2 id="quiz-title" style="font-size: 1.9rem; margin-top:0; background:#fff; border: 2px solid #333; display:inline-block; padding:5px 20px;">과학 문제 풀기</h2>
            <p id="quiz-info-msg" style="font-size: 0.9rem; color: #e74c3c; margin-top: 10px; margin-bottom: 10px; text-align: center; word-break:keep-all; font-weight: bold;">※ 난이도 무작위 출제. 문제를 연속으로 5개 맞추면 무작위 보상(확률 버프 또는 골드)이 부여됩니다!</p>
            <div id="quiz-play" style="display:none;">
                <div id="quiz-streak" style="font-size: 1.0rem; color: #e74c3c; margin-bottom: 10px; font-weight: bold;">🔥 연속 정답: 0</div>
                <div id="quiz-question" style="font-size: 1.35rem; margin-bottom: 20px; font-weight:bold; background:rgba(255,255,255,0.8); padding:10px; border-radius:5px; word-break:keep-all;">문제 내용</div>
                
                <!-- 난이도 하 (주관식) -->
                <div id="quiz-input-area" style="display:none;">
                    <input type="text" id="quiz-answer-input" style="font-size:1.1rem; padding:5px; width:80%; border:2px solid #333; font-family: 'Noto Sans KR', 'Malgun Gothic', 'Dotum', sans-serif; box-sizing:border-box;" placeholder="정답 입력" onkeypress="if(event.key === 'Enter') submitQuizAnswer()">
                    <br><br>
                    <button class="quiz-btn" onclick="submitQuizAnswer()" style="background:#3498db; color:white; width:80%;">정답 제출</button>
                </div>
                
                <!-- 난이도 중/상 (객관식) -->
                <div id="quiz-choices" style="display:none;">
                    <!-- 보기 버튼들이 여기에 생성됨 -->
                </div>
                
                <div id="quiz-result-message" style="font-size: 1.1rem; font-weight: bold; margin: 15px 0;"></div>
                
                <div id="quiz-success-actions" style="display:none; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap:wrap;">
                    <button class="quiz-btn" onclick="startRandomQuiz()" style="background:#27ae60; color:white; margin:0; flex:1;">계속 풀기</button>
                    <button class="quiz-btn" onclick="closeQuiz()" style="background:#e74c3c; color:white; margin:0; flex:1;">그만 풀기</button>
                </div>
                
                <div id="quiz-abandon-btn" style="margin-top: 15px;">
                    <button class="quiz-btn" onclick="closeQuiz()" style="background:#e74c3c; color:#fff; font-size:0.9rem; width:100%;">포기하기 (연속 정답 초기화)</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="custom-alert-modal">
        <div id="custom-alert-content">
            <div id="custom-alert-message">메시지</div>
            <button id="custom-alert-btn" onclick="document.getElementById('custom-alert-modal').style.display='none'">확인</button>
        </div>
    </div>

    <!-- 자동 저장 알림 인디케이터 -->
    <div id="save-indicator">☁️ 자동 저장됨</div>

    <header>
        <h1>검강화게임</h1>
    </header>

    <div id="main-area">
        <!-- Canvas & Actions -->
        <div id="canvas-container">
            <canvas id="gameCanvas" width="450" height="450"></canvas>
            
            <button id="enhance-btn" onclick="triggerEnhance()">망치질 하기! (-50G)</button>
            
            <div class="btn-group">
                <button onclick="saveToInventory()">인벤토리에 보관</button>
                <button onclick="openDictionary()">도감 보기</button>
            </div>
            
            <!-- Inventory -->
            <div id="inventory-panel">
                <div class="inv-slot" onclick="handleInventoryClick(0)" id="inv-0"></div>
                <div class="inv-slot" onclick="handleInventoryClick(1)" id="inv-1"></div>
                <div class="inv-slot" onclick="handleInventoryClick(2)" id="inv-2"></div>
            </div>

            <!-- 강화 일지 -->
            <div style="width: 100%; margin-top: 15px;">
                <div class="section-title">강화 일지</div>
                <div id="log-container"></div>
            </div>
        </div>

        <!-- Right Panel (Info, Shop, Logs) -->
        <div id="ui-panel">
            <div>
                <div class="section-title">강화 확률</div>
                <ul id="prob-list"></ul>
            </div>

            <div>
                <div class="section-title">아이템 (체크 시 자동 사용)</div>
                <div id="item-list" style="margin-bottom: 15px;">
                    <button class="item-btn" id="btn-item-success" onclick="toggleItem('success')">
                        성공 증가 물약 (+10%) <span class="item-count" id="count-success">남은 수량: 3</span>
                    </button>
                    <button class="item-btn" id="btn-item-fail" onclick="toggleItem('fail')">
                        실패 감소 물약 (-10%) <span class="item-count" id="count-fail">남은 수량: 3</span>
                    </button>
                    <button class="item-btn" id="btn-item-protect" onclick="toggleItem('protect')">
                        장비 파괴 보호권 (파괴 방지, ~35단계) <span class="item-count" id="count-protect">남은 수량: 3</span>
                    </button>
                </div>
            </div>

            <!-- 보유 골드 표시 영역 -->
            <div style="text-align: center; margin-bottom: 15px; background: #fff; border: 2px solid var(--border-color); padding: 10px; border-radius: 5px; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);">
                <div id="gold-display" style="margin-top: 0; font-size: 2.2rem;">보유 골드: 250.0 G</div>
            </div>

            <!-- 상점과 돈벌기 탭 분리 -->
            <div>
                <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
                    <button id="tab-earn" onclick="switchTab('earn')" style="flex:1; font-size:1.5rem; background:#f1c40f; border:3px solid #333; border-radius:5px 0 0 5px; cursor:pointer; padding:5px; font-weight:bold;">돈벌기</button>
                    <button id="tab-shop" onclick="switchTab('shop')" style="flex:1; font-size:1.5rem; background:#eee; border:3px solid #333; border-left:none; border-radius:0 5px 5px 0; cursor:pointer; padding:5px; font-weight:normal;">상점</button>
                </div>

                <!-- 상점 내용 -->
                <div id="content-shop" style="display:none; gap:5px; margin-bottom: 15px;">
                    <button class="shop-btn" onclick="buyItem('success', 200)">성공 확률 증가<br>(200G)</button>
                    <button class="shop-btn" onclick="buyItem('fail', 200)">실패 확률 감소<br>(200G)</button>
                    <button class="shop-btn" onclick="buyItem('protect', 5000)">장비 파괴 보호권 (~35단계)<br>(5000G)</button>
                </div>

                <!-- 돈벌기 내용 -->
                <div id="content-earn" style="display:flex; flex-direction:column; gap:10px; margin-bottom: 15px; border:2px dashed var(--border-color); padding:15px; background:#fff; border-radius:5px; box-sizing:border-box;">
                    <div style="font-size:1.2rem; text-align: center; color:#2c3e50; background:#f9ebea; border-radius:5px; padding: 10px;">
                        🔥 클릭 배율: <span id="click-multiplier-display" style="color:#e74c3c; font-weight:bold;">x1.0</span><br>
                        <span style="font-size:1rem; color:#7f8c8d;">(최고 희생 레벨: <span id="sacrificed-level-display">0</span>)</span>
                    </div>
                    <button onclick="sacrificeSword()" style="font-size:1.3rem; width:100%; padding:10px; background:#9b59b6; color:#fff; border:2px solid #8e44ad; border-radius:5px; font-weight:bold; cursor:pointer; box-sizing:border-box;">🗡️ 현재 검 희생하기 (배율 증가)</button>
                    <button onclick="openQuiz()" style="font-size:1.5rem; width:100%; padding:10px; background:#3498db; color:#fff; border:2px solid #2980b9; border-radius:5px; font-weight:bold; cursor:pointer; box-sizing:border-box;">📝 퀴즈 풀기 시작!</button>
                    <button id="btn-free-gold" onclick="earnFreeGold()" style="font-size:1.5rem; width:100%; padding:10px; background:#2ecc71; color:#fff; border:2px solid #27ae60; border-radius:5px; font-weight:bold; cursor:pointer; box-sizing:border-box;">👆 공짜로 돈벌기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /** --- GAME STATE --- */
        let currentLevel = 0;
        let gold = 250;
        let inventory = [null, null, null];
        let unlockedLevels = new Set([0]);
        let sacrificedLevel = 0;
        let totalCorrectAnswers = 0;
        
        let items = { success: 3, fail: 3, protect: 3 };
        let activeItems = { success: false, fail: false, protect: false };
        
        let isAnimating = false;
        let lastTime = 0;
        
        // Canvas & Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btnEnhance = document.getElementById('enhance-btn');
        const logContainer = document.getElementById('log-container');
        const probList = document.getElementById('prob-list');

        // Animation state
        let hammerState = 'IDLE'; 
        let hammerAngle = 0;
        let hitEffectTime = 0;
        let hitEffectResult = '';
        let targetLevel = 0;
        let suspenseTime = 0;
        let wasSuspense = false;

        let quizStreak = 0;
        let activeBuff = null;
        let maintainStreak = 0;
        let isFever = false;
        let feverTime = 0;
        let feverCooldown = 0;

        /** --- CLOUD SAVE INTEGRATION --- */
        let saveTimeout = null;
        function triggerAutoSave() {
            if (typeof window.saveGameState === 'function') {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    window.saveGameState();
                }, 1500); // 1.5초 후 자동 저장
            }
        }

        window.getGameState = function() {
            return {
                currentLevel,
                gold,
                inventory,
                unlockedLevels: Array.from(unlockedLevels),
                items,
                sacrificedLevel,
                totalCorrectAnswers
            };
        };

        window.applyLoadedState = function(state) {
            currentLevel = state.currentLevel ?? 0;
            gold = state.gold ?? 250;
            inventory = state.inventory ?? [null, null, null];
            unlockedLevels = new Set(state.unlockedLevels ?? [0]);
            items = state.items ?? { success: 3, fail: 3, protect: 3 };
            sacrificedLevel = state.sacrificedLevel ?? 0;
            totalCorrectAnswers = state.totalCorrectAnswers ?? 0;
            updateGoldUI();
            updateItemUI();
            updateProbUI();
            updateInventoryUI();
            updateMultiplierUI();
            addLog("☁️ 클라우드에서 게임 정보를 성공적으로 불러왔습니다!", "c-s");
        };

        window.showSaveIndicator = function() {
            const ind = document.getElementById('save-indicator');
            ind.style.opacity = '1';
            setTimeout(() => ind.style.opacity = '0', 2000);
        };

        /** --- QUIZ SYSTEM --- */
        let currentQuiz = null;
        let quizAttempts = 0;

        function openQuiz() {
            document.getElementById('quiz-modal').style.display = 'flex';
            startRandomQuiz();
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
            currentQuiz = null;
            quizStreak = 0;
        }

        function startRandomQuiz() {
            let allQs = [];
            
            // 문제 데이터를 allQs 배열에 합치는 헬퍼 함수
            const addQuestions = (dataObj) => {
                if (dataObj.easy) allQs = allQs.concat(dataObj.easy.map(q => ({...q, difficulty: 'easy'})));
                if (dataObj.medium) allQs = allQs.concat(dataObj.medium.map(q => ({...q, difficulty: 'medium'})));
                if (dataObj.hard) allQs = allQs.concat(dataObj.hard.map(q => ({...q, difficulty: 'hard'})));
            };

            // 변수명이 'quizData'로 시작하는 모든 자바스크립트 객체를 찾아 자동으로 문제 은행에 병합합니다.
            // 예: quizData, quizData1, quizData우주, quizData생물 등 모두 자동 인식
            Object.keys(window).forEach(key => {
                if (key.startsWith('quizData') && typeof window[key] === 'object' && window[key] !== null) {
                    addQuestions(window[key]);
                }
            });

            if (allQs.length === 0) {
                addLog("문제 데이터가 없습니다. 파일을 확인해주세요!", "c-d");
                closeQuiz();
                return;
            }

            const randIdx = Math.floor(Math.random() * allQs.length);
            currentQuiz = allQs[randIdx];
            quizAttempts = 0;

            document.getElementById('quiz-play').style.display = 'block';
            document.getElementById('quiz-question').style.display = 'block'; 
            document.getElementById('quiz-question').innerHTML = `Q. ${currentQuiz.q}`;
            document.getElementById('quiz-streak').innerText = `🔥 연속 정답: ${quizStreak}`;
            document.getElementById('quiz-result-message').innerText = '';
            
            document.getElementById('quiz-success-actions').style.display = 'none';
            document.getElementById('quiz-abandon-btn').style.display = 'block';

            const inputArea = document.getElementById('quiz-input-area');
            const choicesArea = document.getElementById('quiz-choices');

            if (currentQuiz.difficulty === 'easy') {
                const isOX = (currentQuiz.a.toUpperCase() === 'O' || currentQuiz.a.toUpperCase() === 'X');
                
                if (isOX) {
                    inputArea.style.display = 'none';
                    choicesArea.style.display = 'flex';
                    choicesArea.style.flexDirection = 'column';
                    choicesArea.style.gap = '10px';
                    choicesArea.innerHTML = `
                        <button class="quiz-btn" onclick="submitMultipleChoice('O')" style="font-weight:bold; font-size: 1.5rem; color: #2980b9; margin:0;">O (맞다)</button>
                        <button class="quiz-btn" onclick="submitMultipleChoice('X')" style="font-weight:bold; font-size: 1.5rem; color: #c0392b; margin:0;">X (틀리다)</button>
                    `;
                } else {
                    inputArea.style.display = 'block';
                    choicesArea.style.display = 'none';
                    document.getElementById('quiz-answer-input').value = '';
                    setTimeout(() => document.getElementById('quiz-answer-input').focus(), 100);
                }
            } else {
                inputArea.style.display = 'none';
                choicesArea.style.display = 'block';
                
                let choicesHTML = '';
                for(let i=1; i<=5; i++) {
                    if(currentQuiz['c'+i]) {
                        choicesHTML += `<button class="quiz-btn" onclick="submitMultipleChoice('${i}')">${i}. ${currentQuiz['c'+i]}</button>`;
                    }
                }
                choicesArea.innerHTML = choicesHTML;
            }
        }

        function submitQuizAnswer() {
            const ans = document.getElementById('quiz-answer-input').value.trim();
            if(!ans) return;
            checkQuizAnswer(ans);
        }

        function submitMultipleChoice(choiceNum) {
            checkQuizAnswer(choiceNum);
        }

        function checkQuizAnswer(userAnswer) {
            if (!currentQuiz) return;
            
            const isCorrect = (userAnswer.toLowerCase() === currentQuiz.a.toLowerCase());

            quizAttempts++;

            if (isCorrect) {
                let reward = 250;
                
                let mult = Math.max(1, sacrificedLevel / 10);
                reward = reward * mult;
                reward = Math.round(reward * 10) / 10;
                
                gold += reward;
                quizStreak++;
                totalCorrectAnswers++;
                updateGoldUI();
                updateMultiplierUI();
                
                let msg = `[정답] +${reward.toFixed(1)}G! (연속 ${quizStreak}회)`;
                if (quizStreak > 0 && quizStreak % 5 === 0) {
                    let r = Math.random();
                    if (r < 0.25) {
                        activeBuff = 'great_success';
                        msg += " 🎉 대성공 확률 +10% 버프 획득!";
                        addLog("🔥 5연속 정답! 1회 대성공 확률 증가 버프가 적용됩니다.", "c-s");
                    } else if (r < 0.5) {
                        activeBuff = 'success';
                        msg += " 🎉 성공 확률 +10% 버프 획득!";
                        addLog("🔥 5연속 정답! 1회 성공 확률 증가 버프가 적용됩니다.", "c-s");
                    } else if (r < 0.75) {
                        activeBuff = 'fail_reduce';
                        msg += " 🎉 실패 확률 -10% 버프 획득!";
                        addLog("🔥 5연속 정답! 1회 실패 확률 감소 버프가 적용됩니다.", "c-s");
                    } else {
                        gold += 500;
                        msg += " 🎉 500 골드 보너스 획득!";
                        addLog("🔥 5연속 정답! 보너스 500 골드가 추가 지급되었습니다.", "c-s");
                        updateGoldUI();
                    }
                    updateProbUI();
                }
                addLog(msg, "c-info");

                document.getElementById('quiz-input-area').style.display = 'none';
                document.getElementById('quiz-choices').style.display = 'none';
                document.getElementById('quiz-abandon-btn').style.display = 'none';
                document.getElementById('quiz-question').style.display = 'none'; 
                
                const resultMsg = document.getElementById('quiz-result-message');
                resultMsg.style.color = '#27ae60';
                resultMsg.innerText = `정답입니다! (+${reward}G)`;
                document.getElementById('quiz-streak').innerText = `🔥 연속 정답: ${quizStreak}`;
                
                document.getElementById('quiz-success-actions').style.display = 'flex';
                triggerAutoSave();
            } else {
                if (quizAttempts === 1) {
                    addLog(`[오답] 틀렸습니다! 한 번의 기회가 더 남았습니다.`, "c-f");
                    document.getElementById('quiz-question').innerHTML = `<span style="color:#e74c3c;">[오답! 마지막 기회입니다]</span><br>Q. ${currentQuiz.q}`;
                    
                    const isOX = (currentQuiz.a.toUpperCase() === 'O' || currentQuiz.a.toUpperCase() === 'X');
                    if (currentQuiz.difficulty === 'easy' && !isOX) {
                        document.getElementById('quiz-answer-input').value = '';
                        document.getElementById('quiz-answer-input').focus();
                    }
                } else {
                    addLog(`[오답] 기회를 모두 소진했습니다. 연속 정답이 초기화됩니다.`, "c-f");
                    quizStreak = 0;
                    document.getElementById('custom-alert-message').innerText = "기회를 모두 소진했습니다!\n연속 정답이 초기화됩니다.";
                    document.getElementById('custom-alert-modal').style.display = 'flex';
                    closeQuiz();
                    triggerAutoSave();
                }
            }
        }

        /** --- SHOP & MONEY --- */
        function updateGoldUI() {
            document.getElementById('gold-display').innerText = `보유 골드: ${Number(gold).toFixed(1)} G`;
        }

        function switchTab(tab) {
            const tabShop = document.getElementById('tab-shop');
            const tabEarn = document.getElementById('tab-earn');
            const contentShop = document.getElementById('content-shop');
            const contentEarn = document.getElementById('content-earn');

            if (tab === 'shop') {
                contentShop.style.display = 'flex';
                contentEarn.style.display = 'none';
                tabShop.style.background = '#f1c40f';
                tabShop.style.fontWeight = 'bold';
                tabEarn.style.background = '#eee';
                tabEarn.style.fontWeight = 'normal';
            } else {
                contentShop.style.display = 'none';
                contentEarn.style.display = 'flex';
                tabEarn.style.background = '#f1c40f';
                tabEarn.style.fontWeight = 'bold';
                tabShop.style.background = '#eee';
                tabShop.style.fontWeight = 'normal';
            }
        }

        function updateMultiplierUI() {
            let mult = Math.max(1, sacrificedLevel / 10);
            document.getElementById('click-multiplier-display').innerText = `x${mult.toFixed(1)}`;
            document.getElementById('sacrificed-level-display').innerText = sacrificedLevel;
            
            const btn = document.getElementById('btn-free-gold');
            if (btn) {
                if (totalCorrectAnswers >= 5) {
                    btn.disabled = false;
                    btn.innerHTML = `👆 공짜로 돈벌기 (x${mult.toFixed(1)})`;
                    btn.style.background = '#2ecc71';
                    btn.style.borderColor = '#27ae60';
                } else {
                    btn.disabled = true;
                    btn.innerHTML = `🔒 공짜로 돈벌기 (퀴즈 5개 맞추기 ${totalCorrectAnswers}/5)`;
                    btn.style.background = '#95a5a6';
                    btn.style.borderColor = '#7f8c8d';
                }
            }
        }

        function sacrificeSword() {
            if (isAnimating) return;
            if (currentLevel === 0) {
                addLog("희생할 검이 없습니다. 먼저 강화를 진행하세요!", "c-d");
                return;
            }
            if (currentLevel <= 10) {
            addLog("10단계 이하의 검은 제단에 바칠 수 없습니다!", "c-d");
            document.getElementById('custom-alert-message').innerText = "10단계 이하의 검은 희생할 수 없습니다!\n더 높은 단계로 강화한 후 시도해 주세요.";
            document.getElementById('custom-alert-modal').style.display = 'flex';
            return;
        }
        if (currentLevel <= sacrificedLevel) {
                addLog(`현재 검(Lv.${currentLevel})이 기존 희생 레벨(Lv.${sacrificedLevel})보다 낮거나 같습니다!`, "c-f");
                return;
            }
            
            sacrificedLevel = currentLevel;
            currentLevel = 0;
            
            updateProbUI();
            updateMultiplierUI();
            triggerAutoSave();
            
            addLog(`Lv.${sacrificedLevel} 검을 제단에 바쳤습니다! 클릭 배율 증가!`, "c-s");
            document.getElementById('custom-alert-message').innerText = `Lv.${sacrificedLevel} 검을 바쳤습니다!\n돈벌기 효율이 영구적으로 증가합니다.`;
            document.getElementById('custom-alert-modal').style.display = 'flex';
        }

        function earnFreeGold() {
            if (totalCorrectAnswers < 5) return;
            let mult = Math.max(1, sacrificedLevel / 10);
            let rand = Math.random();
            
            if (rand < 0.001) {
                // 0.1% 확률: 장비 파괴 보호권 획득
                items.protect++;
                updateItemUI();
                addLog(`[기적!] 땅을 파다가 '장비 파괴 보호권'을 발견했습니다!`, "c-s");
            } else if (rand < 0.004) {
                // 0.3% 확률: 250골드 획득 (배율 적용)
                let earned = 250 * mult;
                gold += earned;
                addLog(`[초대박!] 엄청난 금화를 발견했습니다! ${earned.toFixed(1)}골드 획득!`, "c-s");
            } else if (rand < 0.054) {
                // 5.0% 확률: 3골드 획득 (배율 적용)
                let earned = 3 * mult;
                gold += earned;
                addLog(`[대박!] 공짜 돈벌기로 ${earned.toFixed(1)}골드를 얻었습니다!`, "c-s");
            } else {
                // 94.6% 확률: 1골드 획득 (배율 적용)
                let earned = 1 * mult;
                gold += earned;
            }
            
            // 부동소수점 오차 방지
            gold = Math.round(gold * 10) / 10;
            
            updateGoldUI();
            triggerAutoSave();
        }

        function buyItem(type, price) {
            if (gold >= price) {
                gold -= price;
                items[type]++;
                updateGoldUI();
                updateItemUI();
                addLog("상점에서 아이템을 구매했습니다.", "c-info");
                triggerAutoSave();
            } else {
                addLog("골드가 부족합니다!", "c-d");
            }
        }

        /** --- ITEMS --- */
        function toggleItem(type) {
            if (!activeItems[type]) {
                if (items[type] <= 0) {
                    addLog("수량이 부족하여 활성화할 수 없습니다.", "c-d");
                    return;
                }
                
                if (type === 'protect' && currentLevel >= 36) {
                    addLog("🚫 36단계 이상에서는 파괴 보호권을 사용할 수 없습니다!", "c-d");
                    return;
                }
            }
            
            activeItems[type] = !activeItems[type];
            updateItemUI();
            updateProbUI();
        }

        function updateItemUI() {
            ['success', 'fail', 'protect'].forEach(type => {
                const btn = document.getElementById(`btn-item-${type}`);
                const countSpan = document.getElementById(`count-${type}`);
                countSpan.innerText = `남은 수량: ${items[type]}`;
                
                if (activeItems[type]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        /** --- PROBABILITY LOGIC --- */
        function getProbabilities() {
            let baseS = 100, baseG = 0, baseM = 0, baseF = 0, baseD = 0;
            
            if (currentLevel < 7) {
                baseS = 90; baseG = 10;
            } else if (currentLevel < 15) {
                baseS = 65; baseG = 5; baseM = 15; baseF = 15;
            } else if (currentLevel < 22) {
                baseS = 50; baseG = 5; baseM = 25; baseF = 15; baseD = 5;
            } else if (currentLevel < 30) {
                baseS = 39; baseG = 1; baseM = 30; baseF = 20; baseD = 10;
            } else {
                // 30단계 이상 수정된 확률
                baseS = 20; baseM = 5; baseF = 35; baseD = 40;
            }

            if (activeItems.success) {
                baseS += 10;
                if (baseF >= 5) baseF -= 5;
                if (baseD >= 5) baseD -= 5;
            }
            if (activeItems.fail) {
                if (baseF >= 10) { baseF -= 10; baseM += 10; }
                else { baseM += baseF; baseF = 0; }
            }
            
            if (activeItems.protect && currentLevel < 36) {
                baseF += baseD; 
                baseD = 0;
            }

            if (activeBuff === 'great_success') {
                baseG += 10;
                if (baseS >= 5) baseS -= 5;
                if (baseM >= 5) baseM -= 5;
            } else if (activeBuff === 'success') {
                baseS += 10;
                if (baseF >= 5) baseF -= 5;
                if (baseD >= 5) baseD -= 5;
            } else if (activeBuff === 'fail_reduce') {
                if (baseF >= 10) { baseF -= 10; baseM += 10; }
                else { baseM += baseF; baseF = 0; }
            }

            let total = baseS + baseG + baseM + baseF + baseD;
            return {
                great: (baseG / total) * 100,
                success: (baseS / total) * 100,
                maintain: (baseM / total) * 100,
                fail: (baseF / total) * 100,
                destroy: (baseD / total) * 100
            };
        }

        function updateProbUI() {
            const p = getProbabilities();
            probList.innerHTML = `
                ${activeBuff === 'great_success' ? '<li style="color:#e74c3c; font-weight:bold; font-size:1.2rem; margin-bottom:10px;">🔥 5연속 정답 버프! (대성공 +10%)</li>' : ''}
                ${activeBuff === 'success' ? '<li style="color:#e74c3c; font-weight:bold; font-size:1.2rem; margin-bottom:10px;">🔥 5연속 정답 버프! (성공 +10%)</li>' : ''}
                ${activeBuff === 'fail_reduce' ? '<li style="color:#e74c3c; font-weight:bold; font-size:1.2rem; margin-bottom:10px;">🔥 5연속 정답 버프! (실패 -10%)</li>' : ''}
                <li class="c-s">대성공 (+2): ${p.great.toFixed(1)}%</li>
                <li class="c-s">성공 (+1): ${p.success.toFixed(1)}%</li>
                <li class="c-m">유지 (0): ${p.maintain.toFixed(1)}%</li>
                <li class="c-f">실패 (-1): ${p.fail.toFixed(1)}%</li>
                <li class="c-d">파괴 (소멸): ${p.destroy.toFixed(1)}%</li>
            `;
        }

        /** --- ENHANCE LOGIC --- */
        function triggerEnhance() {
            if (isAnimating && !isFever) return;
            if (isFever && feverCooldown > 0) return;

            if (!isFever) {
                if (gold < 50) {
                    addLog("강화에 필요한 골드가 부족합니다! (50G 필요)", "c-d");
                    return;
                }
                gold -= 50;
            }
            updateGoldUI();

            isAnimating = true;
            btnEnhance.disabled = true;
            
            const p = getProbabilities();
            
            if (isFever) {
                let s = p.success;
                let f = p.fail;
                if (s + f === 0) { s = 50; f = 50; }
                let randFever = Math.random() * (s + f);
                
                if (randFever < s) {
                    hitEffectResult = 'SUCCESS'; targetLevel = currentLevel + 1;
                } else {
                    hitEffectResult = 'FAIL'; targetLevel = Math.max(0, currentLevel - 1);
                }
                
                feverCooldown = 500;
                hammerState = 'HIT';
                hitEffectTime = 500;
                resolveResult();
                return;
            }

            let rand = Math.random() * 100;
            if (rand < p.great) {
                hitEffectResult = 'GREAT'; targetLevel = currentLevel + 2;
            } else if (rand < p.great + p.success) {
                hitEffectResult = 'SUCCESS'; targetLevel = currentLevel + 1;
            } else if (rand < p.great + p.success + p.maintain) {
                hitEffectResult = 'MAINTAIN'; targetLevel = currentLevel;
            } else if (rand < p.great + p.success + p.maintain + p.fail) {
                hitEffectResult = 'FAIL'; targetLevel = Math.max(0, currentLevel - 1);
            } else {
                hitEffectResult = 'DESTROY'; targetLevel = 0;
            }

            if (activeItems.success) { 
                items.success--; 
                if (items.success <= 0) { activeItems.success = false; addLog("성공 물약을 모두 소모했습니다.", "c-f"); }
            }
            if (activeItems.fail) { 
                items.fail--; 
                if (items.fail <= 0) { activeItems.fail = false; addLog("실패 물약을 모두 소모했습니다.", "c-f"); }
            }
            
            if (activeItems.protect && currentLevel < 36) { 
                items.protect--; 
                if (items.protect <= 0) { activeItems.protect = false; addLog("보호권을 모두 소모했습니다.", "c-f"); }
            }

            if (activeBuff) {
                activeBuff = null;
                addLog("🔥 퀴즈 버프가 소모되었습니다.", "c-m");
            }
            
            updateItemUI();
            updateProbUI();
            
            hammerState = 'SWING_BACK';
            hammerAngle = 0;
        }

        function resolveResult() {
            currentLevel = targetLevel;
            unlockedLevels.add(currentLevel);
            
            if (hitEffectResult === 'GREAT') addLog(`[대성공] 엄청난 섬광! Lv.${currentLevel} 달성!`, 'c-s');
            else if (hitEffectResult === 'SUCCESS') addLog(`[성공] 탕! Lv.${currentLevel} 달성!`, 'c-s');
            else if (hitEffectResult === 'MAINTAIN') addLog(`[유지] 변화가 없습니다.`, 'c-m');
            else if (hitEffectResult === 'FAIL') addLog(`[실패] 아차! 등급이 하락했습니다. Lv.${currentLevel}`, 'c-f');
            else if (hitEffectResult === 'DESTROY') addLog(`[파괴] 검이 산산조각 났습니다...`, 'c-d');
            
            if (!isFever) {
                if (hitEffectResult === 'MAINTAIN') {
                    maintainStreak++;
                    addLog(`연속 유지: ${maintainStreak}/5`, 'c-m');
                    if (maintainStreak >= 5) {
                        isFever = true;
                        feverTime = 3000;
                        maintainStreak = 0;
                        addLog("🌈 피버 타임 발동! 3초간 골드 소모 없이 0.5초 광클 강화!", "c-s");
                        isAnimating = false;
                        btnEnhance.disabled = false;
                    }
                } else {
                    maintainStreak = 0;
                }
            }
            
            if (currentLevel >= 36 && activeItems.protect) {
                activeItems.protect = false;
                addLog("⚠️ 36단계에 도달하여 파괴 보호권이 강제로 해제됩니다!", "c-d");
                updateItemUI();
            }

            updateProbUI();
            triggerAutoSave();
        }

        /** --- RENDERING (PENCIL SKETCH WITH FILLS) --- */
        function drawSwordOnContext(ctx, level, cx, cy, scale = 1, isAnim = false) {
            ctx.save();
            ctx.translate(cx, cy);
            
            ctx.scale(scale, scale);
            ctx.translate(0, 30); 
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3;
            
            const palettes = [
                ['#8B4513', '#A0522D', '#CD853F'], 
                ['#ecf0f1', '#bdc3c7', '#95a5a6'], 
                ['#95a5a6', '#7f8c8d', '#bdc3c7'],

                ['#bdc3c7', '#ecf0f1', '#95a5a6'], 
                ['#34495e', '#2c3e50', '#7f8c8d'], 
                ['#3498db', '#2980b9', '#85c1e9'], 
                ['#e67e22', '#d35400', '#f39c12'], 
                ['#27ae60', '#2ecc71', '#1e8449'], 
                ['#e74c3c', '#c0392b', '#cd6155'], 
                ['#00ced1', '#00ffff', '#48c9b0'], 
                ['#ff69b4', '#ff1493', '#f5b7b1'], 
                ['#f39c12', '#f1c40f', '#f5b041'], 
                ['#f1c40f', '#fffacd', '#f9e79f'], 
                ['#7f8c8d', '#95a5a6', '#b2babb'], 
                ['#c0392b', '#e74c3c', '#922b21'], 
                ['#8e44ad', '#9b59b6', '#7d3c98'], 
                ['#2980b9', '#3498db', '#1f618d'], 
                ['#8b008b', '#9932cc', '#6c3483'], 
                ['#00008b', '#0000cd', '#154360'], 
                ['#4b0082', '#8a2be2', '#5b2c6f'], 
                ['#2ecc71', '#27ae60', '#1d8348'], 
                ['#8b4513', '#a0522d', '#6e2c00'], 
                ['#708090', '#778899', '#5d6d7e'], 
                ['#32cd32', '#00ff00', '#239b56'], 
                ['#f39c12', '#e67e22', '#d68910'], 
                ['#ffd700', '#ff8c00', '#f1c40f'], 
                ['#228b22', '#32cd32', '#196f3d'], 
                ['#d2b48c', '#f5deb3', '#edbb99'], 
                ['#87cefa', '#add8e6', '#a9cce3'], 
                ['#ff4500', '#ff6347', '#e74c3c'], 
                ['#ff00ff', '#da70d6', '#af7ac5'], 
                ['#00ffff', '#e0ffff', '#aed6f1'], 
                ['#a9a9a9', '#c0c0c0', '#7f8c8d'], 
                ['#404040', '#696969', '#1a1a1a']  
            ];

            const p = level < palettes.length ? palettes[level] : [
                `hsl(${(level * 25) % 360}, 80%, 60%)`,
                `hsl(${((level + 5) * 25) % 360}, 80%, 50%)`,
                `hsl(${((level + 10) * 25) % 360}, 80%, 40%)`
            ];
            
            ctx.strokeStyle = typeof isFever !== 'undefined' && isFever ? `hsl(${(Date.now() / 2) % 360}, 100%, 50%)` : '#2c3e50'; 

            if (level >= 20) {
                ctx.save();
                ctx.strokeStyle = p[0]; 
                ctx.globalAlpha = 0.6;
                ctx.lineWidth = 2;
                
                const effectCount = Math.min(40, (level - 19) * 3); 
                for (let i = 0; i < effectCount; i++) {
                    const rx = (Math.random() - 0.5) * 180;
                    const ry = (Math.random() - 0.5) * 250 - 60;
                    const size = Math.random() * 8 + 4;
                    
                    if (Math.random() > 0.4) {
                        ctx.beginPath();
                        ctx.moveTo(rx - size, ry); ctx.lineTo(rx + size, ry);
                        ctx.moveTo(rx, ry - size); ctx.lineTo(rx, ry + size);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.arc(rx, ry, size, 0, Math.PI * 2);
                        ctx.fillStyle = p[1];
                        ctx.fill();
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
            
            const j = () => 0; 
            let shapeCount = 0;
            
            const poly = (pts, forceColor) => {
                ctx.beginPath();
                pts.forEach((pt, i) => {
                    if(i===0) ctx.moveTo(j()+pt[0], j()+pt[1]);
                    else ctx.lineTo(j()+pt[0], j()+pt[1]);
                });
                ctx.closePath();
                ctx.fillStyle = forceColor || p[shapeCount % p.length]; 
                ctx.fill();
                ctx.stroke();
                shapeCount++;
            };
            
            const circle = (x, y, r, forceColor) => {
                ctx.beginPath(); 
                ctx.arc(j()+x, j()+y, r, 0, Math.PI*2);
                ctx.fillStyle = forceColor || p[shapeCount % p.length];
                ctx.fill();
                ctx.stroke();
                shapeCount++;
            };

            const line = (x1, y1, x2, y2) => {
                ctx.beginPath(); 
                ctx.moveTo(j()+x1, j()+y1); 
                ctx.lineTo(j()+x2, j()+y2); 
                ctx.stroke();
            };
            
            const drawHandle = (gW=40) => {
                ctx.beginPath(); 
                ctx.moveTo(j()-gW/2, j()-30); 
                ctx.lineTo(j()+gW/2, j()-30); 
                ctx.lineTo(j()+gW/2, j()-22); 
                ctx.lineTo(j()-gW/2, j()-22); 
                ctx.closePath();
                ctx.fillStyle = '#f1c40f'; 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(j()-6, j()-22); ctx.lineTo(j()+6, j()-22);
                ctx.lineTo(j()+6, j()); ctx.lineTo(j()-6, j());
                ctx.closePath();
                ctx.fillStyle = '#8B4513'; 
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.arc(j(), j(), 8, 0, Math.PI*2);
                ctx.fillStyle = '#e67e22'; 
                ctx.fill(); ctx.stroke();
            };

            const designs = [
                () => { poly([[-4,0], [-2,-80], [2,-80], [4,0]], '#8B4513'); }, 
                () => { drawHandle(); poly([[-10,-30], [-10,-100], [0,-120], [10,-100], [10,-30]]); }, 
                () => { drawHandle(); poly([[-25,-30], [-20,-70], [0,-90], [20,-70], [25,-30]]); }, 
                () => { drawHandle(); poly([[-10,-30], [-30,-80], [0,-120], [-10,-80], [10,-30]]); }, 
                () => { drawHandle(); poly([[-10,-30], [-25,-60], [-5,-60], [-25,-100], [5,-100], [-5,-140], [25,-90], [5,-90], [25,-50], [10,-30]]); }, 
                () => { drawHandle(); poly([[-15,-30], [-15,-100], [-30,-100], [-15,-130], [0,-100], [-5,-100], [-5,-30]]); poly([[15,-30], [15,-100], [30,-100], [15,-130], [0,-100], [5,-100], [5,-30]]); }, 
                () => { drawHandle(); poly([[-10,-30], [-10,-120], [10,-120], [20,-110], [10,-100], [20,-90], [10,-80], [20,-70], [10,-60], [20,-50], [10,-40], [10,-30]]); }, 
                () => { drawHandle(50); poly([[-15,-30], [-15,-130], [15,-130], [15,-30]]); line(-15,-50, 5,-50); line(-15,-70, 5,-70); line(-15,-90, 5,-90); }, 
                () => { drawHandle(); 
                                 poly([[-15,-30], [-15,-100], [15,-100], [15,-30]], '#f1c40f'); 
                                 poly([[-15,-100], [0,-140], [15,-100]], '#f5deb3'); 
                                 poly([[-5,-127], [0,-140], [5,-127]], '#333'); 
                               }, 
                () => { drawHandle(); 
                                 poly([[-5,-30], [-5,-120], [5,-120], [5,-30]], '#654321'); 
                                 poly([[-5,-60], [-25,-80], [-5,-75]], '#228B22'); 
                                 poly([[5,-80], [25,-100], [5,-95]], '#228B22');   
                                 poly([[-5,-100], [-20,-110], [-5,-105]], '#228B22'); 
                               },
                () => { drawHandle(); poly([[-10,-30], [-20,-50], [-5,-70], [-25,-90], [-5,-110], [0,-140], [15,-100], [5,-80], [20,-60], [10,-30]]); }, 
                () => { drawHandle(); poly([[0,-30], [-20,-50], [0,-70], [20,-50]]); poly([[0,-70], [-20,-90], [0,-110], [20,-90]]); poly([[0,-110], [-20,-130], [0,-160], [20,-130]]); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-100], [5,-100], [5,-30]]); circle(-15,-115, 15); circle(15,-115, 15); poly([[-30,-115], [0,-150], [30,-115]]); }, 
                () => { drawHandle(); 
                                 poly([[-5,-30], [-5,-100], [5,-100], [5,-30]], '#f1c40f'); 
                                 poly([[0,-140], [-20,-100], [20,-100]], '#ffd700'); 
                                 poly([[-25,-125], [25,-125], [0,-90]], '#ffd700'); 
                               }, 
                () => { drawHandle(); poly([[-10,-30], [-10,-80], [-40,-120], [-10,-150], [10,-120], [-15,-110], [10,-30]]); }, 
                () => { drawHandle(60); poly([[-25,-30], [-25,-140], [25,-140], [25,-30]]); line(-15,-30, -15,-140); line(15,-30, 15,-140); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-140], [5,-140], [5,-30]]); poly([[5,-100], [40,-140], [40,-80], [5,-120]]); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-150], [5,-150], [5,-30]]); poly([[-5,-140], [-60,-140], [-60,-120], [-5,-120]]); }, 
                () => { drawHandle(); poly([[-15,-30], [-15,-130], [-5,-140], [-5,-30]]); poly([[15,-30], [15,-130], [5,-140], [5,-30]]); line(-5,-80, 5,-80); }, 
                () => { drawHandle(50); 
                                 poly([[-10,-60], [-10,-130], [0,-150], [10,-130], [10,-60]]); 
                                 circle(0,-45, 15, '#fff'); 
                                 circle(0,-45, 5, '#000');  
                               }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-140], [5,-140], [5,-30]]); poly([[-25,-60], [-25,-120], [-15,-120], [-15,-60]]); poly([[25,-60], [25,-120], [15,-120], [15,-60]]); }, 
                () => { poly([[-30,-30], [-40,-50], [-20,-40], [-30,-60], [-10,-40], [0,-30]]); poly([[30,-30], [40,-50], [20,-40], [30,-60], [10,-40], [0,-30]]); poly([[-10,-30], [-5,-130], [5,-130], [10,-30]]); circle(0,0,8); }, 
                () => { drawHandle(); poly([[-10,-30], [-30,-70], [0,-90], [-20,-130], [0,-150], [20,-130], [0,-90], [30,-70], [10,-30]]); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-130], [-30,-130], [-30,-100], [-20,-100], [-20,-120], [5,-120], [5,-30]]); }, 
                () => { drawHandle(); 
                                 poly([[-5,-135], [0,-160], [5,-135]], p[2]);
                                 circle(0,-45, 15); circle(0,-70, 15); circle(0,-95, 15); circle(0,-120, 15); 
                               }, 
                () => { drawHandle(); poly([[-15,-30], [-25,-60], [-10,-70], [-30,-100], [0,-130], [30,-100], [10,-70], [25,-60], [15,-30]]); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-100], [-25,-100], [0,-140], [25,-100], [5,-100], [5,-30]]); }, 
                () => { drawHandle(); poly([[-5,-30], [-5,-140], [5,-140], [5,-30]]); poly([[5,-120], [25,-120], [25,-100], [15,-100], [15,-110], [5,-110]]); }, 
                () => { drawHandle(); poly([[-20,-30], [-20,-130], [0,-150], [20,-130], [20,-30]]); line(-20,-50, -30,-50); line(20,-70, 30,-70); line(-20,-90, -30,-90); line(20,-110, 30,-110); }, 
                () => { drawHandle(); poly([[-10,-30], [-10,-120], [0,-140], [10,-120], [10,-30]]); for(let i=0;i<5;i++) line(-10, -40-i*20, 10, -50-i*20); }, 
                () => { drawHandle(); poly([[-10,-30], [-10,-150], [10,-150], [10,-30]]); for(let i=0;i<4;i++){ poly([[-10, -50-i*20], [-40, -60-i*20], [-10, -70-i*20]]); poly([[10, -50-i*20], [40, -60-i*20], [10, -70-i*20]]); } }, 
                () => { drawHandle(); poly([[-10,-30], [-15,-100], [-30,-110], [-15,-120], [0,-150], [15,-120], [30,-110], [15,-100], [10,-30]]); circle(-5,-115, 3, '#f1c40f'); circle(5,-115, 3, '#f1c40f'); }, 
                () => { drawHandle(); poly([[-20,-30], [-40,-80], [0,-160], [40,-80], [20,-30]]); poly([[-10,-30], [-20,-70], [0,-120], [20,-70], [10,-30]]); }, 
                () => { drawHandle(); for(let i=0; i<8; i++){ poly([[0,-30], [(Math.random()-0.5)*80, -50-Math.random()*80], [0, -150]]); } }, 
                () => { drawHandle(); 
                                 ctx.beginPath(); ctx.moveTo(0, -30);
                                 for(let i=0; i<40; i++){ ctx.lineTo(j() + Math.sin(i)*40, j() - 30 - i*3); } 
                                 ctx.lineTo(0, -150);
                                 for(let i=39; i>=0; i--){ ctx.lineTo(j() + Math.sin(i)*40 + 10, j() - 30 - i*3); }
                                 ctx.closePath();
                                 ctx.fillStyle = p[0]; ctx.fill(); ctx.stroke();
                               }, 
                () => { drawHandle(); 
                                 ctx.beginPath(); ctx.moveTo(0, -30);
                                 for(let i=0; i<60; i++){ ctx.lineTo(j() + (Math.random()-0.5)*80, j() - 30 - Math.random()*150); } 
                                 ctx.closePath();
                                 ctx.fillStyle = p[1]; ctx.fill(); ctx.stroke();
                               }, 
            ];

            if (level < designs.length) {
                designs[level]();
            } else {
                drawHandle(50 + (level - 35));
                ctx.beginPath();
                ctx.moveTo(0,-30);
                for(let i=0; i<60 + (level - 35)*3; i++){
                    ctx.lineTo(j() + (Math.random()-0.5)*120, j() - 30 - Math.random()*(160 + (level - 35)*2));
                }
                ctx.closePath();
                ctx.fillStyle = p[0];
                ctx.fill();
                ctx.stroke();
            }

            // 36~40단계 초월 구간 전용 초대형 오라 및 화려한 파티클 이펙트 추가
            if (level >= 36) {
                ctx.save();
                let extraScale = 1 + (level - 35) * 0.15; // 36~40강으로 갈수록 검이 거대해짐
                ctx.scale(extraScale, extraScale);
                
                // 빛나는 아라베스크 오라 링
                ctx.beginPath();
                ctx.arc(0, -70, 50 + (level - 35)*15, 0, Math.PI * 2);
                ctx.strokeStyle = p[1];
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 5]);
                ctx.stroke();
                
                // 초신성 폭발 파티클
                for(let k = 0; k < 12 + (level - 35)*8; k++) {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = Math.random() * (70 + (level - 35)*25);
                    let px = Math.cos(angle) * dist;
                    let py = -70 + Math.sin(angle) * dist;
                    ctx.beginPath();
                    ctx.arc(px, py, Math.random() * 6 + 3, 0, Math.PI * 2);
                    ctx.fillStyle = k % 2 === 0 ? '#fff' : p[2];
                    ctx.fill();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#fff';
                }
                ctx.restore();
            }

            ctx.restore();
        }

        function drawHammer(ctx, cx, cy, angle) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle + Math.PI / 4); 
            
            ctx.lineWidth = 3;
            ctx.strokeStyle = typeof isFever !== 'undefined' && isFever ? `hsl(${(Date.now() / 2) % 360}, 100%, 50%)` : '#2c3e50';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(-6, 0); ctx.lineTo(-4, -90);
            ctx.moveTo(6, 0); ctx.lineTo(4, -90);
            ctx.moveTo(-6, 0); ctx.lineTo(6, 0); 
            ctx.stroke();
            
            ctx.lineWidth = 4;
            
            ctx.beginPath();
            ctx.moveTo(-35, -112);
            ctx.lineTo(-35, -68);
            ctx.lineTo(-25, -68);
            ctx.lineTo(-25, -112);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-25, -108);
            ctx.lineTo(25, -105);
            ctx.lineTo(45, -95); 
            ctx.lineTo(45, -85);
            ctx.lineTo(25, -75);
            ctx.lineTo(-25, -72);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -107);
            ctx.lineTo(0, -73);
            ctx.moveTo(15, -103);
            ctx.lineTo(15, -77);
            ctx.stroke();
            
            ctx.restore();
        }

        function drawEffect(ctx, cx, cy, type) {
            ctx.save();
            ctx.translate(cx, cy);
            
            ctx.lineCap = 'round';
            const j = (val) => (Math.random() - 0.5) * val;
            
            if (type === 'GREAT') {
                ctx.strokeStyle = '#f1c40f'; 
                ctx.lineWidth = 4;
                for(let i=0; i<12; i++){
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(j(150), j(150)); 
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#f39c12'; 
                for(let i=0; i<10; i++){
                    ctx.beginPath();
                    ctx.arc(j(120), j(120), Math.random()*5 + 2, 0, Math.PI*2);
                    ctx.fill();
                }
                
            } else if (type === 'SUCCESS') {
                ctx.strokeStyle = '#e67e22';
                ctx.lineWidth = 2;
                for(let i=0; i<8; i++){
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(j(80), j(80));
                    ctx.stroke();
                }
                
            } else if (type === 'FAIL') {
                ctx.strokeStyle = '#7f8c8d';
                ctx.lineWidth = 3;
                for(let i=0; i<8; i++){
                    ctx.beginPath();
                    const startX = j(80);
                    const startY = j(40) - 20;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(startX + j(20), startY + Math.random() * 50 + 20); 
                    ctx.stroke();
                }
                
            } else if (type === 'DESTROY') {
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                for(let i=0; i<15; i++){
                    ctx.beginPath();
                    const startX = j(60);
                    const startY = j(60);
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(startX + j(30), startY + j(30));
                    ctx.stroke();
                }
                
            } else if (type === 'MAINTAIN') {
                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 1;
                for(let i=0; i<4; i++){
                    ctx.beginPath();
                    ctx.moveTo(j(30), j(30));
                    ctx.lineTo(j(40), j(40));
                    ctx.stroke();
                }
            }
            
            ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // 반응형 크기에 맞춰 실제 캔버스 내부 좌표도 맞춤 조정
            const rect = canvas.getBoundingClientRect();
            // 내부 해상도를 450으로 고정하여 기존 로직 유지
            if(canvas.width !== 450) {
                canvas.width = 450;
                canvas.height = 450;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let suspenseShakeX = 0;
            let suspenseShakeY = 0;
            let flashAlpha = 0;

            if (hammerState === 'SUSPENSE') {
                let intensity = 1 - Math.max(0, suspenseTime / 3000); 
                let shake = intensity * 20; 
                suspenseShakeX = (Math.random() - 0.5) * shake;
                suspenseShakeY = (Math.random() - 0.5) * shake;
                flashAlpha = Math.pow(intensity, 4); 
            } else if (hammerState === 'HIT' && wasSuspense) {
                flashAlpha = Math.max(0, hitEffectTime / 600); 
            }

            const cx = (canvas.width / 2) + suspenseShakeX;
            const cy = (canvas.height * 0.75) + suspenseShakeY;

            if (!(hammerState === 'HIT' && hitEffectResult === 'DESTROY' && hitEffectTime < 200)) {
                drawSwordOnContext(ctx, currentLevel, cx, cy, 1, true);
                
                ctx.save();
                ctx.font = "bold 1.8rem 'Noto Sans KR', sans-serif";
                ctx.fillStyle = "#2c3e50";
                ctx.textAlign = "center";
                ctx.fillText(`Lv.${currentLevel} ${getSwordName(currentLevel)}`, cx, 40 + suspenseShakeY);
                ctx.restore();
            }

            if (hammerState === 'SWING_BACK') {
                hammerAngle -= 0.1; 
                if (hammerAngle < -1.0) hammerState = 'STRIKE';
                drawHammer(ctx, cx + 50, cy - 100, hammerAngle);
            } else if (hammerState === 'STRIKE') {
                hammerAngle += 0.6; 
                if (hammerAngle > 0.5) {
                    if (currentLevel >= 30) {
                        hammerState = 'SUSPENSE';
                        suspenseTime = 3000;
                        wasSuspense = true;
                        drawHammer(ctx, cx + 50, cy - 100, 0.6); 
                    } else {
                        hammerState = 'HIT';
                        hitEffectTime = 250; 
                        wasSuspense = false;
                        resolveResult();
                    }
                } else {
                    drawHammer(ctx, cx + 50, cy - 100, hammerAngle);
                }
            } else if (hammerState === 'SUSPENSE') {
                suspenseTime -= dt;
                drawHammer(ctx, cx + 50, cy - 100, 0.6); 

                if (suspenseTime <= 0) {
                    hammerState = 'HIT';
                    hitEffectTime = 600; 
                    resolveResult();
                }
            } else if (hammerState === 'HIT') {
                hitEffectTime -= dt;
                drawEffect(ctx, cx, cy - 100, hitEffectResult);
                if (hitEffectTime <= 0) {
                    hammerState = 'IDLE';
                    isAnimating = false;
                    btnEnhance.disabled = false;
                    wasSuspense = false;
                }
            }

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (isFever) {
                feverTime -= dt;
                if (feverTime <= 0) {
                    isFever = false;
                    addLog("🌈 피버 타임 종료!", "c-m");
                    if (!isAnimating) btnEnhance.disabled = false;
                }
            }
            if (feverCooldown > 0) {
                feverCooldown -= dt;
                if (feverCooldown <= 0 && isFever) {
                    isAnimating = false;
                    btnEnhance.disabled = false;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        /** --- INVENTORY & DICT --- */
        function updateInventoryUI() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`inv-${i}`);
                slot.innerHTML = '';
                if (inventory[i] !== null) {
                    const c = document.createElement('canvas');
                    c.width = 60; c.height = 60;
                    c.style.width = '100%';
                    c.style.height = '100%';
                    const tctx = c.getContext('2d');
                    drawSwordOnContext(tctx, inventory[i], 30, 45, 0.3, false);
                    slot.appendChild(c);
                    
                    const lvlTxt = document.createElement('div');
                    lvlTxt.className = 'inv-lvl';
                    lvlTxt.innerText = `Lv.${inventory[i]}`;
                    slot.appendChild(lvlTxt);
                } else {
                    slot.innerText = "+";
                    slot.style.fontSize = "2rem";
                    slot.style.color = "#ccc";
                }
            }
        }

        function saveToInventory() {
            if (isAnimating) return;
            const emptyIdx = inventory.indexOf(null);
            if (emptyIdx !== -1) {
                inventory[emptyIdx] = currentLevel;
                currentLevel = 0;
                addLog(`검을 보관했습니다. 새 검을 꺼냅니다.`, "c-info");
                updateInventoryUI();
                updateProbUI();
                triggerAutoSave();
            } else {
                addLog("보관함이 가득 찼습니다!", "c-d");
            }
        }

        function handleInventoryClick(idx) {
            if (isAnimating) return;
            const item = inventory[idx];
            
            if (item !== null) {
                const temp = currentLevel;
                currentLevel = item;
                if (temp > 0) {
                    inventory[idx] = temp;
                    addLog(`Lv.${item} 검을 꺼내고 Lv.${temp} 검을 넣었습니다.`, "c-info");
                } else {
                    inventory[idx] = null;
                    addLog(`Lv.${item} 검을 꺼냈습니다.`, "c-info");
                }
                
                if (currentLevel >= 36 && activeItems.protect) {
                    activeItems.protect = false;
                    addLog("⚠️ 36단계 이상 검을 장착하여 파괴 보호권이 강제로 해제되었습니다!", "c-d");
                    updateItemUI();
                }

                updateInventoryUI();
                updateProbUI();
                triggerAutoSave();
            }
        }

        function getSwordName(lvl) {
            const names = [
                "나뭇가지", "일반검", "뚱뚱한 단검", "곡도", "번개검", "쌍포크검", "톱날검", "플라스틱 자(Ruler)검", "연필검", "가시나무검",
                "화염검", "얼음검", "하트검", "별모양 지팡이검", "달검", "넙적 대검", "도끼", "사신의 낫", "쌍인검", "눈동자 마검",
                "포세이돈 삼지창", "박쥐날개검", "팽이 회오리검", "해적 갈고리검", "체인 사슬검", "끈적 슬라임검", "표지판 화살표검", "마법의 열쇠검", "뚱뚱 선인장검", "미라 붕대검",
                "천사 날개검", "드래곤 머리검", "더블 겹검", "유리 파편검", "용수철 스프링검", "알수없는 혼돈의 검",
                "초월: 성운의 심판", "초월: 태양계의 지배자", "초월: 은하단 파괴자", "초월: 우주의 창조신"
            ];
            if (lvl < names.length) return names[lvl];
            return `초월검 [${lvl}단계]`;
        }

        function openDictionary() {
            const content = document.getElementById('dict-content');
            content.innerHTML = ''; 
            
            const tiers = [
                { name: "🥉 초급 구간 (0~9단계)", start: 0, end: 9 },
                { name: "🥈 중급 구간 (10~19단계)", start: 10, end: 19 },
                { name: "🥇 고급 구간 (20~29단계)", start: 20, end: 29 },
                { name: "💎 마스터 구간 (30~35단계)", start: 30, end: 35 },
                { name: "🌌 초월 구간 (36~40단계)", start: 36, end: 40 }
            ];

            tiers.forEach(tier => {
                let isTierUnlocked = false;
                for (let i = tier.start; i <= tier.end; i++) {
                    if (unlockedLevels.has(i)) {
                        isTierUnlocked = true;
                        break;
                    }
                }

                const header = document.createElement('div');
                header.style.fontSize = "1.8rem";
                header.style.fontWeight = "bold";
                header.style.marginTop = "20px";
                header.style.marginBottom = "15px";
                header.style.padding = "5px 15px";
                header.style.background = isTierUnlocked ? "#f1c40f" : "#bdc3c7";
                header.style.border = "3px solid var(--border-color)";
                header.style.display = "inline-block";
                header.style.borderRadius = "5px";
                header.innerText = isTierUnlocked ? tier.name : "??? 구간";
                
                content.appendChild(header);

                const grid = document.createElement('div');
                grid.style.display = "grid";
                grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(130px, 1fr))";
                grid.style.gap = "20px";
                grid.style.marginBottom = "30px";

                for (let i = tier.start; i <= tier.end; i++) {
                    const card = document.createElement('div');
                    card.className = `dict-card ${unlockedLevels.has(i) ? '' : 'locked'}`;
                    
                    const canv = document.createElement('canvas');
                    canv.width = 120; canv.height = 120;
                    const tctx = canv.getContext('2d');
                    
                    const nameTxt = document.createElement('div');
                    nameTxt.className = 'dict-name';

                    if (unlockedLevels.has(i)) {
                        drawSwordOnContext(tctx, i, 60, 90, 0.6, false);
                        nameTxt.innerText = `Lv.${i} ${getSwordName(i)}`;
                    } else {
                        tctx.font = "bold 50px 'Noto Sans KR', sans-serif";
                        tctx.fillStyle = "#999";
                        tctx.textAlign = "center";
                        tctx.fillText("?", 60, 80);
                        nameTxt.innerText = `Lv.${i} 미발견`;
                    }
                    
                    card.appendChild(canv);
                    card.appendChild(nameTxt);
                    grid.appendChild(card);
                }
                
                content.appendChild(grid);
            });
            
            document.getElementById('dict-modal').style.display = 'flex';
        }

        async function openRanking() {
            document.getElementById('ranking-modal').style.display = 'flex';
            const contentList = document.getElementById('ranking-content-list');
            contentList.innerHTML = '<div style="text-align:center; padding:20px; font-size:1.5rem;">데이터를 불러오는 중입니다... ⏳</div>';
            
            if (typeof window.fetchLeaderboard === 'function') {
                const players = await window.fetchLeaderboard();
                contentList.innerHTML = '';
                
                if (players.length === 0) {
                    contentList.innerHTML = '<div style="text-align:center; padding:20px; font-size:1.5rem;">아직 등록된 랭킹이 없습니다.</div>';
                    return;
                }
                
                players.forEach((p, idx) => {
                    const item = document.createElement('div');
                    item.className = 'ranking-item';
                    
                    let rankDisplay = `${idx + 1}위`;
                    if (idx === 0) rankDisplay = '🥇 1위';
                    if (idx === 1) rankDisplay = '🥈 2위';
                    if (idx === 2) rankDisplay = '🥉 3위';

                    item.innerHTML = `
                        <div class="ranking-rank">${rankDisplay}</div>
                        <div class="ranking-info">
                            <div style="font-weight:bold;">Lv.${p.level} ${getSwordName(p.level)}</div>
                            <div style="font-size:1.2rem; color:#f39c12;">보유 골드: ${Number(p.gold).toFixed(1)}G</div>
                            <div class="ranking-uid">UID: ${p.uid}</div>
                        </div>
                    `;
                    contentList.appendChild(item);
                });
            } else {
                contentList.innerHTML = '<div style="text-align:center; padding:20px; color:#e74c3c; font-size:1.5rem;">클라우드 기능이 연결되지 않았습니다.</div>';
            }
        }

        function addLog(msg, className) {
            const p = document.createElement('div');
            p.className = className;
            p.innerText = `- ${msg}`;
            logContainer.prepend(p);
        }

        // Initialize
        window.onload = function() {
            let loadedCount = 0;
            Object.keys(window).forEach(key => {
                if (key.startsWith('quizData') && typeof window[key] === 'object' && window[key] !== null) {
