                }
            });
            
            if (loadedCount > 0) {
                addLog(`문제 데이터를 성공적으로 불러왔습니다! (${loadedCount}개 파일)`, "c-s");
            } else {
                addLog("문제 데이터를 찾을 수 없습니다. quiz_data.js 등의 파일을 확인해주세요.", "c-f");
            }
            updateGoldUI();
            updateItemUI();
            updateProbUI();
            updateInventoryUI();
            updateMultiplierUI();
            requestAnimationFrame(gameLoop);
            
            // 기존 환영 문구 삭제 및 튜토리얼 추가 (역순으로 추가하여 1번이 맨 위에 오도록 설정)
            addLog("👉 팁: 검을 희생하면 돈벌기 배율이 영구 증가합니다. (단, 36단계 이상은 보호권 사용 불가!)", "c-d");
            addLog("4. 높은 단계의 검은 [인벤토리에 보관]하여 안전하게 보존할 수 있습니다.", "c-m");
            addLog("3. [상점] 탭에서 물약과 보호권을 구매하여 강화 확률을 높여보세요.", "c-m");
            addLog("2. [돈벌기] 탭에서 퀴즈를 풀거나 공짜 골드를 클릭해 강화 비용을 모으세요.", "c-m");
            addLog("1. [망치질 하기!] 버튼을 눌러 50G를 소모하여 검을 강화하세요.", "c-m");
            addLog("📜 [게임 튜토리얼 안내] 📜", "c-info");
        };

    </script>

    <!-- 클라우드 저장 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Cloud Authentication Error:", error);
                }
            };

            initAuth();

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    window.currentUserUid = user.uid;
                    await loadDataFromCloud();
                }
            });

            async function loadDataFromCloud() {
                if (!db || !window.currentUserUid) return;
                const docRef = doc(db, 'artifacts', appId, 'users', window.currentUserUid, 'saveData', 'slot1');
                try {
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        if (typeof window.applyLoadedState === 'function') {
                            window.applyLoadedState(data);
                        }
                    }
                } catch (error) {
                    console.error("Failed to load game state:", error);
                }
            }

            window.saveGameState = async () => {
                if (!db || !window.currentUserUid || typeof window.getGameState !== 'function') return;
                
                const state = window.getGameState();
                const privateDocRef = doc(db, 'artifacts', appId, 'users', window.currentUserUid, 'saveData', 'slot1');
                const publicDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', window.currentUserUid);
                
                try {
                    await setDoc(privateDocRef, state);
                    await setDoc(publicDocRef, {
                        uid: window.currentUserUid,
                        level: state.currentLevel,
                        gold: state.gold,
                        timestamp: Date.now()
                    });
                    
                    if (typeof window.showSaveIndicator === 'function') {
                        window.showSaveIndicator();
                    }
                } catch (error) {
                    console.error("Failed to save game state:", error);
                }
            };

            window.fetchLeaderboard = async () => {
                if (!db) return [];
                try {
                    const querySnapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'));
                    let players = [];
                    querySnapshot.forEach((doc) => {
                        players.push(doc.data());
                    });
                    
                    players.sort((a, b) => {
                        if (b.level !== a.level) return b.level - a.level;
                        return b.gold - a.gold;
                    });
                    
                    return players;
                } catch (error) {
                    console.error("Failed to load leaderboard:", error);
                    return [];
                }
            };
        }
    </script>
